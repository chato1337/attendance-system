[project]
name = "attendance-backend"
version = "0.1.0"
description = "API multi-tenant del sistema de control y registro de acceso."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
addopts = "--cov=apps/tenants --cov=apps/people --cov=apps/access --cov=apps/sync --cov=apps/reports --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["apps/tenants", "apps/people", "apps/access", "apps/sync", "apps/reports"]
omit = ["*/migrations/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/**" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
plugins = []
# mypy es opcional en esta fase y no bloquea CI.
# Para usarlo en local: pip install mypy django-stubs djangorestframework-stubs
