name: attendance

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
    environment: &django_env
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: dev-only-attendance-secret-key-32b
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,nginx
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://localhost:8080,http://localhost
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIELD_ENCRYPTION_KEY: 9ABHw7khRINU5hwTHBX-eRy9vK8ttpqxQIzsHU3CNLQ=
      FACEAUTH_WEB_URL: http://localhost:8090
      FACEAUTH_API_URL: http://localhost:8090/api/v1
      RUN_MIGRATIONS: "1"
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --reload
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    build:
      context: ../backend
    environment: *django_env
    command: celery -A config.celery worker --loglevel=info
    volumes:
      - ../backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  channels:
    build:
      context: ../backend
    environment: *django_env
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - ../backend:/app
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  frontend_node_modules:
